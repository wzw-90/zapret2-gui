# Global WinDivert & IP Cache Settings
--ipcache-hostname=1
--wf-filter-lan=1

# WinDivert port redirection
--wf-tcp-out=80,443,2053,2083,2087,2096,8443
--wf-udp-out=443,19294-19344,50000-65535

# Load Lua scripts
--lua-init=@lua/zapret-lib.lua
--lua-init=@lua/zapret-antidpi.lua
--lua-init=@lua/zapret-auto.lua

# Load binary fake blobs
--blob=fake_discord_udp:@bin/blobs/ACTIVE_DISCORD_UDP.bin
--blob=fake_tls_google:@bin/blobs/tls_clienthello_www_google_com.bin
--blob=fake_tls_max:@bin/blobs/tls_clienthello_max_ru.bin
--blob=fake_quic_google:@bin/blobs/quic_initial_www_google_com.bin
--blob=stun2:@bin/blobs/stun2.bin

# Profile 1: YouTube QUIC UDP 443 (Drop to force reliable TCP)
--name=youtube-quic
--filter-udp=443
--hostlist=lists/hosts-youtube.txt
--lua-desync=drop

# Profile 2: YouTube HTTPS TCP 443 (Fake with TCP TS fooling + Google ClientHello multisplit)
--new=youtube-tcp
--filter-tcp=443
--hostlist=lists/hosts-youtube.txt
--hostlist-exclude=lists/hosts-exclude.txt
--lua-desync=fake:blob=fake_tls_google:repeats=8:tcp_ts=-1000:ip_id=zero
--lua-desync=multisplit:pos=2:seqovl=681:seqovl_pattern=fake_tls_google

# Profile 3: Discord Voice UDP (WebRTC Voice Channels)
--new=discord-voice-udp
--filter-udp=19294-19344,50000-65535
--lua-desync=fake:blob=fake_discord_udp:repeats=6

# Profile 4: Discord Web and Gateway TCP
--new=discord-gateway-tcp
--filter-tcp=443,2053,2083,2087,2096,8443
--hostlist=lists/hosts-discord.txt
--hostlist-exclude=lists/hosts-exclude.txt
--lua-desync=fake:blob=fake_tls_google:repeats=8:tcp_ts=-1000:ip_id=zero
--lua-desync=multisplit:pos=2:seqovl=681:seqovl_pattern=fake_tls_google

# Profile 5: General & User Sites (Fake with Max RU ClientHello multisplit)
--new=general-auto
--filter-tcp=80,443,8443
--hostlist=lists/hosts-general.txt
--hostlist=lists/hosts-user.txt
--hostlist-exclude=lists/hosts-exclude.txt
--lua-desync=fake:blob=fake_tls_max:repeats=8:tcp_ts=-1000:ip_id=zero
--lua-desync=multisplit:pos=2:seqovl=664:seqovl_pattern=fake_tls_max